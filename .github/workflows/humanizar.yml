name: humanizar

# On changes to the engine: the tests, and that the Rust binary still answers like the plugin's
# TypeScript. On a humanizar-v* tag: also builds it for each system and publishes the Release.
on:
  push:
    tags: ["humanizar-v*"]
    branches: [main]
    paths: ["humanizar-mcp/**", "plugins/humanizar/hooks/**", ".github/workflows/humanizar.yml"]
  pull_request:
    paths: ["humanizar-mcp/**", "plugins/humanizar/hooks/**", ".github/workflows/humanizar.yml"]

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: humanizar-mcp
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The TypeScript engine still gives the saved answers
        run: |
          node humanizar-mcp/tests/generar_golden.mjs
          git diff --ignore-cr-at-eol --exit-code humanizar-mcp/tests/golden.json
      - run: cargo test --release --locked
        working-directory: humanizar-mcp

  compilar:
    if: startsWith(github.ref, 'refs/tags/humanizar-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
          # musl: fully static, so it runs on any distribution, whatever its libc and however old.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: humanizar-mcp
      - name: It needs nothing the system doesn't bring
        run: |
          d=humanizar-mcp/target/${{ matrix.target }}/release
          case "${{ matrix.target }}" in
            *-windows-*)
              if grep -aqiE 'vcruntime|msvcp|api-ms-win-crt' "$d/humanizar.exe"; then
                echo "the .exe needs the Visual C++ runtime"; exit 1
              fi ;;
            *-linux-*)
              file "$d/humanizar" | grep -qE 'static(ally|-pie) linked'
              # busybox has no libc for it to lean on.
              printf 'A día de hoy lo utilizo.' | docker run --rm -i -v "$PWD/$d:/h:ro" busybox:stable /h/humanizar check | grep -q 'Hoy lo uso' ;;
            *-apple-*)
              if otool -L "$d/humanizar" | tail -n +2 | grep -vE '/usr/lib/(libSystem|libiconv)'; then
                echo "the binary needs a library macOS doesn't bring"; exit 1
              fi ;;
          esac
      - name: Package and try it
        run: |
          d=humanizar-mcp/target/${{ matrix.target }}/release
          mkdir paquete
          printf 'A día de hoy lo utilizo.' | "$d/humanizar" check | grep -q 'Hoy lo uso'
          if [ "${{ matrix.ext }}" = zip ]; then
            cp "$d/humanizar.exe" paquete/
            (cd paquete && 7z a -tzip "../humanizar-${{ matrix.target }}.zip" humanizar.exe >/dev/null)
          else
            cp "$d/humanizar" paquete/
            tar -czf "humanizar-${{ matrix.target }}.tar.gz" -C paquete humanizar
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: humanizar-${{ matrix.target }}
          path: humanizar-${{ matrix.target }}.${{ matrix.ext }}

  publicar:
    needs: [pruebas, compilar]
    if: startsWith(github.ref, 'refs/tags/humanizar-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Checksums and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd paquetes
          sha256sum humanizar-* > SHA256SUMS
          cat SHA256SUMS
          # Not the repository's "latest": this repo holds several plugins, and the installers name the tag.
          gh release create "$GITHUB_REF_NAME" humanizar-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "Humanizar ${GITHUB_REF_NAME#humanizar-}" \
            --notes "humanizar as a standalone binary: an MCP server and \`humanizar setup <agent>\` for 14 coding agents, with the same engine as the Claude Code plugin. Install: see plugins/humanizar/README.md."

  # What a person does: the real installer against the published Release, then an agent's conversation.
  instalar:
    needs: publicar
    if: startsWith(github.ref, 'refs/tags/humanizar-v')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and talk to it
        run: |
          casa="$(mktemp -d)"
          mkdir -p "$casa/.codex" "$casa/.gemini"
          export HUMANIZAR_SETUP_HOME="$casa" HUMANIZAR_INSTALL_DIR="$casa/bin" HUMANIZAR_VERSION="$GITHUB_REF_NAME"
          sh humanizar-mcp/install.sh
          grep -q '\[mcp_servers.humanizar\]' "$casa/.codex/config.toml"
          grep -q '"humanizar"' "$casa/.gemini/settings.json"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"humanizar","arguments":{"textos":["A día de hoy lo utilizo."]}}}' | "$casa/bin/humanizar" mcp > respuesta.json
          grep -q 'Hoy lo uso' respuesta.json
